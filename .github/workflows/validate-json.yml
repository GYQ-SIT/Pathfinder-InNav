name: Validate data JSON

on:
  push:
    branches: [main]
    paths:
      - 'InNavi/Data/**.json'
      - '.github/workflows/validate-json.yml'
      - 'scripts/validate_schema.py'
  pull_request:
    paths:
      - 'InNavi/Data/**.json'
      - '.github/workflows/validate-json.yml'
      - 'scripts/validate_schema.py'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Validate every JSON file under InNavi/Data
        run: |
          files=$(mktemp)
          trap 'rm -f "$files"' EXIT
          find InNavi/Data -type f -name '*.json' -print0 > "$files"
          status=0
          while IFS= read -r -d '' f; do
            echo "Checking $f"
            if ! PYTHONPATH=scripts python3 -c "import sys; from validate_schema import load; load(sys.argv[1])" "$f"; then
              echo "::error file=$f::Invalid JSON"
              status=1
            fi
          done < "$files"
          exit $status
