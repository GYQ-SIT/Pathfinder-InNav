name: Test self-hosted runner

# Manual trigger only - this just checks the team12 OVH VM runner is reachable
# and picks up jobs. Not a real build step; delete once the real CI workflow exists.
on:
  workflow_dispatch:

jobs:
  ping:
    runs-on: [self-hosted, linux, ovh]
    steps:
      - run: |
          echo "Runner is alive"
          hostname
          whoami
          uname -a
