name: Deploy wiki

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'scripts/publish-wiki.py'
      - '.github/workflows/deploy-wiki.yml'
  workflow_dispatch:

env:
  WIKI_DIR: /var/www/innavi-wiki

permissions:
  contents: read

concurrency:
  group: deploy-wiki
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, ovh]
    steps:
      - uses: actions/checkout@v4

      - name: Build the site with MkDocs
        run: |
          python3 -m venv "$RUNNER_TEMP/wiki-venv"
          "$RUNNER_TEMP/wiki-venv/bin/pip" install --quiet mkdocs
          "$RUNNER_TEMP/wiki-venv/bin/mkdocs" build --site-dir site

      - name: Publish to the web root
        run: |
          python3 scripts/publish-wiki.py site "$WIKI_DIR"
