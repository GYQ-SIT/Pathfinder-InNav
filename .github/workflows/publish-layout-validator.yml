name: Publish layout validator
on:
  push:
    tags: ['innavi-layout-validator-v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://npm.pkg.github.com
          scope: '@gyq-sit'
      - name: Verify tag, version and source archive
        working-directory: InNavi/Plugins/InNaviLayoutValidator
        shell: bash
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "innavi-layout-validator-v$VERSION" ]]; then exit 1; fi
          npm pack --dry-run
      - name: Publish immutable source version
        working-directory: InNavi/Plugins/InNaviLayoutValidator
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve consumer lock and verify installed source
        run: |
          VERSION=$(node -p 'require("./InNavi/Plugins/InNaviLayoutValidator/package.json").version')
          npm install --ignore-scripts --save-exact "@gyq-sit/innavi-layout-validator@$VERSION"
          node scripts/install-layout-validator.mjs --check
          mkdir -p registry-artifacts
          cp package.json package-lock.json registry-artifacts/
          npm pack "@gyq-sit/innavi-layout-validator@$VERSION" --ignore-scripts --pack-destination registry-artifacts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: layout-validator-consumer-lock
          path: registry-artifacts/
