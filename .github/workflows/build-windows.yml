name: Build, analyse and test (Windows)

# Runs on the team's own self-hosted Windows runner (has UE5.8 + Visual Studio already installed) - the team12 Ubuntu VM can't do this
# (wrong OS/underpowered). The checks that need no Unreal Engine are in lint.yml, on a GitHub-hosted runner.
#
# A pull request is merged only when this passes: the editor builds from a clean checkout (all the code in one unity build, which is where
# a name used twice in two files shows up), the product code has no finding of the MSVC static analyser, and every automation test passes.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: [self-hosted, windows]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://npm.pkg.github.com
          scope: '@gyq-sit'

      - name: Install the exact released Unreal plugin source
        shell: cmd
        run: |
          call npm ci --ignore-scripts
          if errorlevel 1 exit /b 1
          node scripts/install-layout-validator.mjs --check
          if errorlevel 1 exit /b 1
          node scripts/install-layout-validator.mjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build InNaviEditor (Win64, Development)
        shell: cmd
        run: |
          "C:\Program Files\Epic Games\UE_5.8\Engine\Build\BatchFiles\Build.bat" InNaviEditor Win64 Development -Project="%GITHUB_WORKSPACE%\InNavi\InNavi.uproject" -WaitMutex -DisableAdaptiveUnity

      - name: Static analysis of the C++ (MSVC /analyze)
        shell: cmd
        run: |
          "C:\Program Files\Epic Games\UE_5.8\Engine\Build\BatchFiles\Build.bat" InNaviEditor Win64 Development -Project="%GITHUB_WORKSPACE%\InNavi\InNavi.uproject" -WaitMutex -DisableAdaptiveUnity -StaticAnalyzer=Default -StaticAnalyzerOutputType=Text > "%RUNNER_TEMP%\analysis.log" 2>&1
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\check-analysis.ps1 -Log "%RUNNER_TEMP%\analysis.log"

      - name: Automation tests (all of InNavi.*)
        shell: cmd
        run: |
          "C:\Program Files\Epic Games\UE_5.8\Engine\Binaries\Win64\UnrealEditor-Cmd.exe" "%GITHUB_WORKSPACE%\InNavi\InNavi.uproject" -unattended -nullrhi -nosplash -nosound -ExecCmds="Automation RunTests InNavi; Quit" -ReportExportPath="%GITHUB_WORKSPACE%\InNavi\Saved\AutomationReport"

      - name: Check the test report (the editor exits 0 even when a test fails)
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\check-test-report.ps1 -Report "%GITHUB_WORKSPACE%\InNavi\Saved\AutomationReport" -MinimumTests 150

      - name: Keep the test report and the performance measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-and-performance
          path: |
            InNavi/Saved/AutomationReport
            InNavi/Saved/Performance
          if-no-files-found: warn
          retention-days: 30
