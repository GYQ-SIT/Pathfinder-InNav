; Device profiles of the project. Only the Android ones are changed here.
;
; Unreal renders an Android game into a buffer of about 720p (1280 on the long side) multiplied by r.MobileContentScaleFactor, and the phone
; stretches that buffer over the screen. Every base Android profile sets the factor to 1.0 (0.8 for Android_Low), so the phone app was drawn at
; 576x1280 and stretched to the 1080x2400 of the screen, which is why its text and edges were soft. 0 means the screen's own resolution.
; Each profile sets it itself, so each one has to be overridden here.
[Android DeviceProfile]
+CVars=r.MobileContentScaleFactor=0

[Android_Low DeviceProfile]
+CVars=r.MobileContentScaleFactor=0

[Android_Mid DeviceProfile]
+CVars=r.MobileContentScaleFactor=0

[Android_High DeviceProfile]
+CVars=r.MobileContentScaleFactor=0

[Android_Epic DeviceProfile]
+CVars=r.MobileContentScaleFactor=0
