[/Script/UnrealEd.ProjectPackagingSettings]
; The UMG icon textures under /Game/ImageAssets are only ever referenced via a runtime
; LoadObject<UTexture2D>(TEXT("/Game/ImageAssets/...")) string path (Save/Snap/Gizmo/toolbar icons,
; etc.) - the cooker's normal "follow references from what's already known to be needed" pass never
; sees that reference (it's a string baked into compiled code, not a UPROPERTY/Blueprint reference),
; so without this, every one of those textures gets silently excluded from a packaged build and
; renders as a blank/white square at runtime. This forces the whole folder to always be cooked.
+DirectoriesToAlwaysCook=(Path="/Game/ImageAssets")
; InNavi/Data/ (Audio/*.wav, sample buildings.json/map_extended.db, DefaultLayouts/) lives outside
; Content/ entirely and is read via raw file IO (FFileHelper/IFileManager against
; FPaths::ProjectDir()/"Data"), not the UFS/.pak virtual filesystem - packaging never stages it
; unless told to, which is why a packaged build had no audio at all. "../Data" is relative to the
; project's Content directory (this property's own convention), one level up to the project root.
+DirectoriesToAlwaysStageAsNonUFS=(Path="../Data")
