[/Script/UnrealEd.ProjectPackagingSettings]
; Project JSON, audio and SQLite use Unreal's platform file APIs (SQLiteCore supplies an Unreal VFS).
; Put the data in the APK/pak so it can be read on Android without a separately copied loose Data folder.
-DirectoriesToAlwaysStageAsNonUFS=(Path="../Data")
+DirectoriesToAlwaysStageAsUFS=(Path="../Data")
